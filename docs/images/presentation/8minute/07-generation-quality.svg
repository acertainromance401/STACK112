<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">텍스트 반환과 유효 출력은 다르다</title>
  <desc id="description">아홉 요청 모두 텍스트를 반환했지만 요구 인용 형식 통과는 영 건이다. L3 B0의 원문과 실제 원시 출력 일부를 비교하면 새로운 의무 창설 금지와 반대 방향의 답변이 보인다. 영 건의 형식 통과를 법률 정답률 영 퍼센트로 해석하지 않는다.</desc>
  <rect width="1280" height="720" fill="#0C1117"/>
  <g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <text x="64" y="58" fill="#8ABFC6" font-size="16" font-weight="600">07 / 생성과 검증 결과</text>
    <text x="64" y="111" fill="#EDF0F3" font-size="34" font-weight="700">텍스트 반환과 유효 출력은 다르다</text>
    <text x="64" y="151" fill="#BBC6D1" font-size="20">반환 여부 · 인용 형식 · 원문에 대한 내용 충실성은 각각 확인한다.</text>
    <g id="output-counts">
      <rect x="64" y="185" width="552" height="126" rx="3" fill="#1B222B" stroke="#8ABFC6"/>
      <text x="96" y="266" fill="#8ABFC6" font-size="64" font-weight="700">9/9</text>
      <text x="276" y="236" fill="#EDF0F3" font-size="27" font-weight="600">텍스트 반환</text>
      <text x="276" y="280" fill="#BBC6D1" font-size="20">실제 Llama 엔진 · 요청별 1회</text>
      <rect x="664" y="185" width="552" height="126" rx="3" fill="#1B222B" stroke="#D7B282"/>
      <text x="696" y="266" fill="#D7B282" font-size="64" font-weight="700">0/9</text>
      <text x="876" y="236" fill="#EDF0F3" font-size="27" font-weight="600">요구 인용 형식 통과</text>
      <text x="876" y="280" fill="#BBC6D1" font-size="20">앱은 형식 오류로 처리</text>
    </g>
    <text x="64" y="356" fill="#BBC6D1" font-size="22" font-weight="600">L3 · B0 원문 대조 / 현재 판례만 사용한 실행</text>
    <g id="source-output-comparison">
      <rect x="64" y="380" width="552" height="174" rx="3" fill="#1B222B" stroke="#53606E"/>
      <text x="92" y="417" fill="#8ABFC6" font-size="21" font-weight="600">원문 일부</text>
      <text x="92" y="468" fill="#EDF0F3" font-size="28">“새로운 의무를 창설할 수</text>
      <text x="92" y="512" fill="#EDF0F3" font-size="28">있는 것은 아니다.”</text>
      <rect x="664" y="380" width="552" height="174" rx="3" fill="#1B222B" stroke="#D7B282"/>
      <text x="692" y="417" fill="#D7B282" font-size="21" font-weight="600">실제 원시 출력 일부</text>
      <text x="692" y="468" fill="#EDF0F3" font-size="28">“새로운 조건을 추가할 수 있는</text>
      <text x="692" y="512" fill="#EDF0F3" font-size="28">경우에만 적용된다.”</text>
    </g>
    <text x="64" y="603" fill="#D7B282" font-size="22" font-weight="600">형식 통과 0/9 ≠ 법률 정확도 0% / 독립 법률 전문가 평가는 아직 없음</text>
    <path d="M64 642 H1216" stroke="#53606E"/>
    <text x="64" y="681" fill="#8896A5" font-size="15">자료: mode_summary.csv · L3-currentOnly.json · 2026으552 사용자 제공 원문 / 원문·출력은 일부 발췌</text>
  </g>
</svg>
