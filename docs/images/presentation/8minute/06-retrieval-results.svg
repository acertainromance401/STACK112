<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">관련 선례 발견과 비관련 참고 거절은 다르다</title>
  <desc id="description">키워드 B1과 하이브리드 H는 각각 양성 질문 두 개에서 B를 문서 1위로 찾았으나 음성 질문 한 개의 참고 없음 판정은 실패했다. L1과 L2에는 B, L3에는 비관련 A가 실제 입력됐다. L1과 L2 검색에는 C도 섞였지만 생성에는 전달되지 않았다.</desc>
  <rect width="1280" height="720" fill="#0C1117"/>
  <g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <text x="64" y="58" fill="#8ABFC6" font-size="16" font-weight="600">06 / 검색 결과</text>
    <text x="64" y="111" fill="#EDF0F3" font-size="34" font-weight="700">관련 선례 발견과 비관련 참고 거절은 다르다</text>
    <text x="64" y="151" fill="#BBC6D1" font-size="20">B1·H의 검색 문서 집합·문서 순서는 같았음 / 선택 청크까지 동일하다는 뜻은 아님</text>
    <g id="retrieval-observations">
      <rect x="64" y="186" width="552" height="120" rx="3" fill="#1B222B" stroke="#8ABFC6"/>
      <text x="94" y="258" fill="#8ABFC6" font-size="64" font-weight="700">2/2</text>
      <text x="260" y="233" fill="#EDF0F3" font-size="24" font-weight="600">양성 질문 · 관련 선례 1위</text>
      <text x="260" y="277" fill="#BBC6D1" font-size="20">B1·H 각각 / 전체 정확도 아님</text>
      <rect x="664" y="186" width="552" height="120" rx="3" fill="#1B222B" stroke="#D7B282"/>
      <text x="694" y="258" fill="#D7B282" font-size="64" font-weight="700">0/1</text>
      <text x="860" y="233" fill="#EDF0F3" font-size="24" font-weight="600">음성 질문 · 참고 없음 성공</text>
      <text x="860" y="277" fill="#BBC6D1" font-size="20">B1·H 각각 / 비관련 A 채택</text>
    </g>
    <g id="document-level-results">
      <rect x="64" y="338" width="1152" height="224" rx="3" fill="#1B222B" stroke="#53606E"/>
      <path d="M64 394 H1216 M64 450 H1216 M64 506 H1216 M224 338 V562 M464 338 V562 M784 338 V562" stroke="#53606E"/>
      <g fill="#BBC6D1" font-size="21" font-weight="600">
        <text x="88" y="373">질문</text>
        <text x="248" y="373">기대 참고</text>
        <text x="488" y="373">B1·H 문서 1위</text>
        <text x="808" y="373">실제 전달 참고 문서</text>
      </g>
      <g fill="#EDF0F3" font-size="24">
        <text x="88" y="430">L1</text>
        <text x="248" y="430">B · 97므1486</text>
        <text x="488" y="430">B · 97므1486</text>
        <text x="808" y="430">B의 청크 2개</text>
        <text x="88" y="486">L2</text>
        <text x="248" y="486">B · 97므1486</text>
        <text x="488" y="486">B · 97므1486</text>
        <text x="808" y="486">B의 청크 2개</text>
      </g>
      <g fill="#D7B282" font-size="24">
        <text x="88" y="542">L3</text>
        <text x="248" y="542">없음</text>
        <text x="488" y="542">A · 2024므16033</text>
        <text x="808" y="542">비관련 A의 청크 2개</text>
      </g>
    </g>
    <text x="64" y="597" fill="#BBC6D1" font-size="19">L1·L2의 상위 3청크에는 C도 혼입됐지만 실제 생성 입력에는 포함되지 않았다.</text>
    <text x="64" y="625" fill="#D7B282" font-size="18">L2는 사건번호 명시 대조 조건 / B0는 검색하지 않으므로 참고 거절 성공으로 평가하지 않음</text>
    <path d="M64 642 H1216" stroke="#53606E"/>
    <text x="64" y="681" fill="#8896A5" font-size="15">자료: 실제 판례 파일럿 2026-11-03 / A: 재산분할 · B: 일반 법리 선례 · C: 면접교섭 / 잠정 관련성, 전문가 미검수</text>
  </g>
</svg>
