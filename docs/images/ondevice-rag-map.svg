<?xml version="1.0" encoding="UTF-8"?>
<svg id="rag-map" xmlns="http://www.w3.org/2000/svg" width="1320" height="1056" viewBox="0 0 1320 1056" role="group" aria-labelledby="map-title map-desc">
          <title id="map-title">STACK112 온디바이스 RAG 동작 지도</title>
          <desc id="map-desc">첫 줄은 사진·텍스트 입력, 로컬 분석, SwiftData 저장, 검색 코퍼스 동기화다. 둘째 줄은 현재 판례 선택, 요약 캐시, 검색, 근거 선택이다. 셋째 줄은 오른쪽에서 왼쪽으로 프롬프트 예산 검사, 로컬 생성, 후처리, 화면 표시다. 점선은 주입 요약 보존, 캐시 적중, 입력 예산 실패 경로다. 유사 판례 top5 조회는 별도 병렬 경로다.</desc>
          <style>
            text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #262e28; }
            .node { cursor: pointer; transition: opacity .16s; }
            .card { fill: #fff; stroke: #c2cbc1; stroke-width: 1.2; rx: 4px; ry: 4px; }
            .node:hover .card, .node:focus .card { stroke: #365d4d; stroke-width: 2; }
            .node.selected .card { fill: #fff8f1; stroke: #a64b2a; stroke-width: 2.2; }
            .node.selected .small { fill: #a64b2a; }
            .node:focus { outline: none; }
            .small { font-size: 10px; font-weight: 650; letter-spacing: 1px; }
            .heading { font-size: 21px; font-weight: 700; letter-spacing: -.6px; }
            .body { font-size: 14px; fill: #515f55; }
            .code, .code-function { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #626c63; }
            .code-function { fill: #306957; }
            .lane { font-size: 12px; font-weight: 700; fill: #606d62; letter-spacing: .5px; }
            .edge-label { font-size: 12px; fill: #68756c; font-weight: 500; }
            .wire { fill: none; stroke: #8c9a8d; stroke-width: 1.7; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
            .rag-wire { fill: none; stroke: #286c61; stroke-width: 2; marker-end: url(#arrow-teal); stroke-linejoin: round; }
            .bypass { fill: none; stroke: #aa7446; stroke-width: 1.7; stroke-dasharray: 5 5; marker-end: url(#arrow-amber); stroke-linejoin: round; }
            .blue, .purple { fill: #657269; } .teal { fill: #286c61; } .amber { fill: #976038; }
            .row-bg { fill: #f0f3ed; }
            @media (prefers-reduced-motion: reduce) { .node { transition: none; } }
          </style>
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9a8d"/></marker>
            <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#286c61"/></marker>
            <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aa7446"/></marker>
          </defs>
